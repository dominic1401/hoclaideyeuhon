<style>
:root{
--bg:#f3f5ff; --surface:#ffffff; --ink:#151a3d; --muted:#5d668c; --line:#e1e5f7; --track:#e8ebfa;
--au:#ff9500; --au-ink:#a85a00; --au-soft:#fff1db;
--th:#00b894; --th-ink:#007561; --th-soft:#d9f7ef;
--nc:#6c5ce7; --nc-ink:#4a3ac4; --nc-soft:#ece9ff;
--heart:#ff3d71; --focus:#3a4ff0; --good:#0a8f4d;
--hero:#0e1336; --hero-2:#1a2160; --hero-ink:#ffffff; --hero-muted:#b4bcf0;
--h-au:#ffb84d; --h-th:#3ee0be; --h-nc:#a99cff;
--f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
--f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0b0f2b; --surface:#151b45; --ink:#eef0ff; --muted:#a3acd9; --line:#262e66; --track:#222a5c;
--au-ink:#ffb84d; --au-soft:#3a2b10; --th-ink:#3ee0be; --th-soft:#0f3a35; --nc-ink:#b3a8ff; --nc-soft:#2b2766;
--heart:#ff7a9c; --focus:#9aa8ff; --good:#4ade80; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0b0f2b; --surface:#151b45; --ink:#eef0ff; --muted:#a3acd9; --line:#262e66; --track:#222a5c;
--au-ink:#ffb84d; --au-soft:#3a2b10; --th-ink:#3ee0be; --th-soft:#0f3a35; --nc-ink:#b3a8ff; --nc-soft:#2b2766;
--heart:#ff7a9c; --focus:#9aa8ff; --good:#4ade80; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding:16px 16px 56px}
.wrap{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;line-height:1.1;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px;margin-bottom:8px}h3{font-size:17px}
p{margin:0 0 8px}
a{color:var(--focus)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:800;text-decoration:none;color:var(--focus)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:13px}
.note{background:var(--nc-soft);color:var(--nc-ink);border-radius:12px;padding:10px 14px;font-weight:600}
details{border-bottom:1px solid var(--line)}
details:last-child{border:0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;padding:8px 0;list-style:none;gap:10px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";flex:none;width:24px;height:24px;border-radius:50%;background:var(--track);color:var(--focus);display:grid;place-items:center;font-weight:800}
details[open] summary::before{content:"\2212"}
details div{padding:0 0 12px 34px;color:var(--ink)}
summary:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;font:800 14px var(--f-body);border:2px solid var(--focus);background:var(--focus);color:#fff;cursor:pointer;text-decoration:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b0f2b}}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],select{min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:600 15px var(--f-body);background:var(--surface);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 200px}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin-top:8px}
.ppl label{display:flex;gap:10px;align-items:center;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.ppl input{width:22px;height:22px;flex:none}
.ppl label.done{background:var(--th-soft);color:var(--th-ink)}
.msg{font-weight:700}.err{color:var(--heart)}.ok{color:var(--good)}
</style></head><body><div class="wrap">

<header><h1>Ghi nhận bài in giấy</h1><p style="color:var(--muted)">Trang dành cho người phụ trách. Cần mã số để mở.</p></header>
<section class="card" id="gate"><label for="code"><b>Mã số</b></label><div class="row"><input id="code" type="password" autocomplete="off" inputmode="text"><button class="btn" id="open" type="button">Mở</button></div><p class="msg err" id="gmsg" role="alert"></p></section>
<section id="panel" hidden>
<div class="card"><div class="row"><div><label for="wk"><b>Tuần</b></label><select id="wk"></select></div><div><label for="who"><b>Người ghi nhận</b></label><input id="who" type="text" placeholder="Tên của bạn" value="Dominic"></div></div>

<div id="units"></div>

</section>

var WEEKS=[["w1","Tuần 1 · Bài số 2 (14/10–17/10/2026)"],["w2","Tuần 2 · Bài số 3 (21/10–24/10/2026)"],["w3","Tuần 3 · Bài số 4 (28/10–31/10/2026)"],["w4","Tuần 4 · Bài số 5 (4/11–7/11/2026)"],["w5","Tuần 5 · Bài số 6 (11/11–14/11/2026)"],["w6","Tuần 6 · Bài số 7 (18/11–21/11/2026)"]];
var $=function(i){return document.getElementById(i)}, CODE="", ROS=[], SENT={};
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function decrypt(code){
  var raw=b64(BLOB), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function sk(){try{return JSON.parse(localStorage.getItem("giaySent")||"{}")}catch(e){return {}}}
function sv(){try{localStorage.setItem("giaySent",JSON.stringify(SENT))}catch(e){}}
function render(){
  var box=$("units"); box.textContent=""; var wk=$("wk").value, by={};
  ROS.forEach(function(r){(by[r.u]=by[r.u]||[]).push(r.n)});
  Object.keys(by).forEach(function(u){
    var c=document.createElement("div"); c.className="card"; var h=document.createElement("h3"); h.textContent=u; c.appendChild(h);
    var g=document.createElement("div"); g.className="ppl";
    by[u].forEach(function(n){
      var l=document.createElement("label"), i=document.createElement("input"), s=document.createElement("span");
      i.type="checkbox"; i.dataset.u=u; i.dataset.n=n; s.textContent=n; var k=wk+"|"+n;
      if(SENT[k]){i.disabled=true;i.checked=true;l.className="done";s.textContent=n+" · đã ghi nhận"}
      l.appendChild(i); l.appendChild(s); g.appendChild(l);
    });
    c.appendChild(g); box.appendChild(c);
  });
}
$("open").onclick=async function(){
  var m=$("gmsg"); m.textContent="";
  try{ ROS=await decrypt($("code").value.trim()); CODE=$("code").value.trim(); }
  catch(e){ m.textContent="Mã số không đúng."; return }
  $("gate").hidden=true; $("panel").hidden=false; SENT=sk();
  WEEKS.forEach(function(w){var o=document.createElement("option");o.value=w[0];o.textContent=w[1];$("wk").appendChild(o)});
  $("wk").onchange=render; render();
};
$("code").addEventListener("keydown",function(e){if(e.key==="Enter")$("open").click()});
$("send").onclick=async function(){
  var sel=[].slice.call(document.querySelectorAll("#units input:checked:not(:disabled)")), m=$("smsg");
  if(!sel.length){m.className="msg err";m.textContent="Chưa tick ai.";return}
  var b=$("send"); b.disabled=true; m.className="msg"; m.textContent="Đang gửi…"; var ok=0, wk=$("wk").value;
  for(var i=0;i<sel.length;i++){
    var body=new URLSearchParams({"form-name":"giay",code:CODE,week:wk,unit:sel[i].dataset.u,name:sel[i].dataset.n,by:$("who").value});
    try{ var r=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()});
      if(r.ok){SENT[wk+"|"+sel[i].dataset.n]=1; ok++} }catch(e){}
  }
  sv(); render(); b.disabled=false;
  m.className="msg "+(ok===sel.length?"ok":"err"); m.textContent="Đã ghi nhận "+ok+"/"+sel.length+" người.";
};
